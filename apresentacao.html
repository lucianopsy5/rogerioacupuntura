<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Apresentação • Rogério Fávaro</title><link rel="icon" href="assets/marca.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#e9ece4;font-family:'Segoe UI',Arial,sans-serif;color:#203f36}.bar{height:76px;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ccd4c5;background:#f8f6ef;gap:20px}.bar strong{font:22px Georgia,serif}.bar small{display:block;font-size:10px;margin-top:4px;color:#61705e}.tools{display:flex;gap:8px}.tools button,.tools a{font:12px 'Segoe UI',sans-serif;border:1px solid #c5cebd;padding:10px 15px;border-radius:4px;background:transparent;color:#203f36;cursor:pointer;text-decoration:none}.tools button[aria-pressed=true]{background:#203f36;color:#fffdf8;border-color:#203f36}.workspace{height:calc(100vh - 76px);display:flex;justify-content:center;align-items:center;padding:24px}.frame{height:100%;width:100%;border:0;background:#f8f6ef;border-radius:8px;box-shadow:0 12px 40px #203f3612;transition:width .25s;display:block}.workspace.mobile .frame{width:390px;max-width:100%;border:7px solid #203f36;border-radius:29px}.frame:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #a9613e;outline-offset:3px}@media(max-width:650px){.bar{height:auto;min-height:100px;padding:14px 18px;display:block}.bar strong{font-size:20px}.tools{margin-top:12px}.tools button,.tools a{font-size:11px;padding:8px 12px}.workspace{height:calc(100dvh - 121px);padding:12px}.workspace.mobile .frame{border-width:4px;border-radius:17px}}
</style></head><body><header class="bar"><div><strong>Rogério Fávaro Acupuntura</strong><small>Conceito de presença digital · demonstração local</small></div><div class="tools" role="group" aria-label="Visualização"><button type="button" id="desktop" aria-pressed="true">Computador</button><button type="button" id="mobile" aria-pressed="false">Celular</button><a href="index.html" target="_blank" rel="noopener">Abrir site ↗</a></div></header><main class="workspace" id="workspace"><iframe class="frame" id="site-preview" src="index.html" title="Protótipo de Rogério Fávaro Acupuntura"></iframe></main><script>
const workspace=document.querySelector('#workspace');const desktop=document.querySelector('#desktop');const mobile=document.querySelector('#mobile');function setView(isMobile){workspace.classList.toggle('mobile',isMobile);desktop.setAttribute('aria-pressed',String(!isMobile));mobile.setAttribute('aria-pressed',String(isMobile));}desktop.addEventListener('click',()=>setView(false));mobile.addEventListener('click',()=>setView(true));
</script></body></html>
